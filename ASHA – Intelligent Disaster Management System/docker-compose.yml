services:

  django:

    image: koustavmitra18/asha:latest

    container_name: asha_django

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - mongodb

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      MONGO_HOST: mongodb

    volumes:
      - .:/app

  postgres:

    image: postgres:17

    container_name: asha_postgres

    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:

    image: mongo:8

    container_name: asha_mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:

  postgres_data:

  mongo_data: